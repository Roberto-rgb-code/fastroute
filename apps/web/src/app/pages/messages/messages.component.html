<app-module-page
  title="Mensajes"
  subtitle="Chat con conductores por ruta (web ↔ app mobile)."
  icon="message"
>
  @if (loading()) {
    <p class="py-16 text-center text-sm text-ink-400">Cargando rutas…</p>
  } @else if (!routes().length) {
    <div class="rounded-2xl border border-ink-200 bg-white py-16 text-center text-ink-400">
      <app-icon name="message" [size]="32" class="mx-auto mb-2" />
      <p class="text-sm">No hay rutas activas hoy para chatear.</p>
    </div>
  } @else {
    <div class="grid min-h-[min(70vh,640px)] gap-4 overflow-hidden rounded-2xl border border-ink-200 bg-white shadow-sm md:grid-cols-[280px_1fr]">
      <aside class="border-b border-ink-100 md:border-b-0 md:border-r">
        <p class="border-b border-ink-100 px-4 py-3 text-xs font-bold uppercase tracking-wide text-ink-400">Rutas del día</p>
        <ul class="max-h-[280px] overflow-y-auto md:max-h-none">
          @for (r of routes(); track r.id) {
            <li>
              <button
                type="button"
                class="flex w-full flex-col gap-0.5 border-b border-ink-50 px-4 py-3 text-left transition hover:bg-ink-50"
                [class.bg-brand-50]="selectedId() === r.id"
                (click)="selectedId.set(r.id)"
              >
                <span class="truncate text-sm font-semibold text-ink-900">{{ r.name }}</span>
                <span class="text-[11px] text-ink-500">{{ r.driver?.name ?? 'Sin operador' }}</span>
                <span class="mt-1 self-start rounded-md px-2 py-0.5 text-[10px] font-bold" [class]="tonePill(r.status)">
                  {{ ROUTE_LABEL[r.status] }}
                </span>
              </button>
            </li>
          }
        </ul>
      </aside>
      <div class="flex min-h-[360px] flex-col bg-ink-50/50">
        @if (selectedId(); as rid) {
          <div class="flex items-center justify-between border-b border-ink-100 bg-white px-4 py-2">
            <span class="text-xs text-ink-500">Conversación en vivo</span>
            <a class="text-xs font-semibold text-brand-600" [routerLink]="['/app/routes', rid]">Abrir ruta →</a>
          </div>
          <div class="min-h-0 flex-1">
            <app-route-chat [routeId]="rid" />
          </div>
        }
      </div>
    </div>
  }
</app-module-page>
