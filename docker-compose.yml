services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: fastroute
      POSTGRES_PASSWORD: fastroute
      POSTGRES_DB: fastroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastroute -d fastroute"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - storage

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fastroute:fastroute@postgres:5432/fastroute?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-prod-32chars}
      API_PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/geopy/geocode.py:/app/apps/api/geopy/geocode.py:ro
      - ./apps/api/geopy/requirements.txt:/app/apps/api/geopy/requirements.txt:ro
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/angular.json:/app/apps/web/angular.json:ro
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/proxy.conf.docker.json:/app/apps/web/proxy.conf.docker.json:ro
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
